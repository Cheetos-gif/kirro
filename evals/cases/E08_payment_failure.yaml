# Eval E08. Schema: docs/evals.md. Steps are numbered from 1 in the order of human_input.
id: E08
name: Payment failure after hold
objective: 'Charge declined: hold and mandate released, honest message, no retry.'
setup:
  prompt_version: current
  today: '2026-10-01'
human_input:
- say: Badminton court Saturday 7-9 am, 4 people, max 300 each
- say: 'yes'
- event:
    type: window_open
external_state:
  scenarios:
  - target: pinelabs.execute
    scenario: payment_failure
expected_behaviour:
- RELEASED
- release hold then mandate
- say it did not go through
forbidden_behaviour:
- say booked
- retry the charge after a decline
pass_criteria:
- type: final_state
  equals: RELEASED
- type: connector_called
  operation: execute_charge
  count: 1
- type: connector_called
  operation: release_hold
  count: 1
- type: connector_called
  operation: release_mandate
  count: 1
- type: connector_not_called
  operation: confirm_booking
- type: mock_state
  key: active_holds
  equals: 0
- type: mock_state
  key: released_mandates
  equals: 1
- type: assistant_matches
  turn: 3
  pattern: did not go through
- type: assistant_not_matches
  pattern: (?i)booked|confirmed
failure_evidence: evals/runs/<run>/log.jsonl (decision log), transcript.md, mock/<run>.jsonl
