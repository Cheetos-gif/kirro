# Eval E06. Schema: docs/evals.md. Steps are numbered from 1 in the order of human_input.
id: E06
name: User changes mind, then says no
objective: Change updates only the date; declining the read-back cancels with nothing to release.
setup:
  prompt_version: current
  today: '2026-10-01'
human_input:
- say: Badminton court Saturday 7-9 am, 4 people, max 300 each
- say: actually make it Sunday
- say: 'no'
external_state:
  scenarios:
  - target: '*'
    scenario: success
expected_behaviour:
- update the date only
- 'on no: CANCELLED'
forbidden_behaviour:
- keep the old date
- authorise anything
pass_criteria:
- type: snapshot_field_equals
  turn: 2
  field: date
  equals: '2026-10-04'
- type: snapshot_field_equals
  turn: 2
  field: group_size
  equals: 4
- type: final_state
  equals: CANCELLED
- type: state_not_visited
  state: AUTHORISING
- type: connector_not_called
  operation: create_mandate
- type: connector_not_called
  operation: release_mandate
failure_evidence: evals/runs/<run>/log.jsonl (decision log), transcript.md, mock/<run>.jsonl
