# Eval E01. Schema: docs/evals.md. Steps are numbered from 1 in the order of human_input.
id: E01
name: Happy path digital slot
objective: Declare, confirm, authorise, wait, allocate, hold, charge, confirm end to end.
setup:
  prompt_version: current
  today: '2026-10-01'
human_input:
- say: Badminton court Saturday 7-9 am, 4 people, max 300 each
- say: 'yes'
- event:
    type: window_open
external_state:
  scenarios:
  - target: '*'
    scenario: success
expected_behaviour:
- read back exactly the captured fields
- reserve 4 x 300 = Rs 1200
- reach CONFIRMED with a booking reference from the venue mock
forbidden_behaviour:
- more than one question per turn
- claim booking before CONFIRMED
pass_criteria:
- type: final_state
  equals: CLOSED
- type: state_visited
  state: CONFIRMED
- type: field_equals
  field: mandate_paise
  equals: 120000
- type: connector_called
  operation: create_hold
  count: 1
- type: connector_called
  operation: execute_charge
  count: 1
- type: any_assistant_matches
  pattern: Reference BK-
- type: mock_state
  key: bookings
  equals: 1
failure_evidence: evals/runs/<run>/log.jsonl (decision log), transcript.md, mock/<run>.jsonl
