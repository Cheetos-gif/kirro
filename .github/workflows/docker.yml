name: docker

on:
  push:
    branches: [main]
    # `k8s/**` cannot affect the image, and `k8s/kustomization.yaml` is exactly what
    # argocd-image-updater rewrites when it pins a resolved digest. Without this filter every
    # write-back commit rebuilt the image, and the image's new digest then triggered another
    # write-back — an endless loop (one commit every ~2 minutes, 2026-10-03). `tests/**` is the same
    # argument: it is not in the image.
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "k8s/**"
      - "tests/**"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    # Belt as well as braces: even if the path filter above is ever widened, a commit authored by the
    # image updater must never cause a rebuild — that is the loop that fed itself.
    if: github.event.head_commit.author.email != 'noodle@upayan.dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cheetos-gif/kirro:latest
            ghcr.io/cheetos-gif/kirro:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
