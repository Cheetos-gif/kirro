# Which connectors are real vs mock. Env vars PINE_LABS_MODE / GNANI_MODE / DELHIVERY_MODE override `mode`.
# No secrets here. Labels follow docs/connectors.md (REAL / DOCUMENTED / MOCK REQUIRED / UNKNOWN).
connectors:
  venue_inventory:
    mode: mock                  # MOCK REQUIRED: no rail exposes time-boxed slot holds
    base_url_env: MOCK_SERVER_URL
  pine_labs:
    mode: mock                  # target: real P3P sandbox once credentials exist
    sandbox_base_url: https://pluraluat.v2.pinepg.in   # P3PEnvironment.SANDBOX in SDK 1.3.0
  gnani:
    mode: mock                  # real: Inya platform, needs GNANI_INYA_API_KEY + whitelisted numbers
  delhivery:
    mode: mock                  # competition-required mock
    staging_base_url: https://staging-express.delhivery.com
core:
  port: 8080
mock_server:
  port: 8081
