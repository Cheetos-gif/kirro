[project]
name = "kirro"
version = "0.1.0"
description = "Mock external services (venue inventory + hold + declare pool, Pine Labs mandate, DIFD draw, Delhivery) for the AgenticOrg-hosted KIRRO agent (Ken Case-Build 2026, Round 3)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "mcp>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "black>=24",
    "pre-commit>=4.6.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E731"]

[tool.black]
line-length = 120
target-version = ["py311"]
