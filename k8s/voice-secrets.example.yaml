# NOT applied by kustomize — this is a template. Create the real secret before kirro-livekit and
# kirro-voice sync, or those two pods sit in CreateContainerConfigError (the mock is unaffected).
#
#   kubectl create secret generic kirro-voice -n kirro \
#     --from-literal=GNANI_API_KEY="$VACHANA_API_KEY_ID" \
#     --from-literal=AGENTICORG_EMAIL="you@example.com" \
#     --from-literal=AGENTICORG_PASSWORD="..." \
#     --from-literal=LIVEKIT_API_KEY="$(openssl rand -hex 16)" \
#     --from-literal=LIVEKIT_API_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=LIVEKIT_KEYS="$LIVEKIT_API_KEY: $LIVEKIT_API_SECRET"
#
# GNANI_API_KEY is the Gnani (Vachana) speech key from https://app.gnani.ai/voice/api-keys.
# AGENTICORG_EMAIL / AGENTICORG_PASSWORD are the AgenticOrg dashboard login the worker signs in with
# to drive the Kirro Declare agent — API keys are agenticorg:admin-only, so there is no lesser
# credential (ADR-016).
#
# LIVEKIT_KEYS is the room server's own copy, in LiveKit's "key: secret" format; the same pair is
# what the portal signs browser tokens with (web/'s LIVEKIT_API_KEY / LIVEKIT_API_SECRET) and what
# the worker authenticates with. Generate it once — changing it invalidates every issued token.
apiVersion: v1
kind: Secret
metadata:
  name: kirro-voice
  namespace: kirro
type: Opaque
stringData:
  GNANI_API_KEY: ""
  AGENTICORG_EMAIL: ""
  AGENTICORG_PASSWORD: ""
  LIVEKIT_API_KEY: ""
  LIVEKIT_API_SECRET: ""
  LIVEKIT_KEYS: ""
