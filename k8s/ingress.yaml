# The mock server is the only service now and must be reachable from the hosted AgenticOrg platform,
# so the Ingress points at kirro-mock. Scenario control stays off the public path: a demo sets it with
# `kubectl port-forward svc/kirro-mock 8081:8081 -n kirro` and POST /__admin/scenario.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kirro-mock-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  # No `tls:` block: Traefik serves the *.upayan.dev default certificate (TLSStore `default` in
  # kube-system, Cloudflare Origin CA).
  rules:
    - host: api-kirro.upayan.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kirro-mock
                port:
                  number: 8081
