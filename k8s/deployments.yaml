# One image (ghcr.io/cheetos-gif/kirro), three Deployments. KIRRO's decision-making brain lives on
# the AgenticOrg platform (docs/decisions/ADR-011-kirro-brain-moves-to-agenticorg.md), not here.
#
# kirro-mock   the mock external services the AgenticOrg-hosted agent calls.
# kirro-livekit  the WebRTC room server the browser publishes its microphone to (ADR-017).
# kirro-voice    the LiveKit agent worker: Gnani speech around the AgenticOrg agent (ADR-017).
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kirro-mock
  labels:
    app: kirro-mock
spec:
  # replicas: 1 is load-bearing — the mock keeps its state in SQLite (ADR-013), which is a
  # single-writer store. Do not scale this horizontally without moving the state first.
  replicas: 1
  selector:
    matchLabels:
      app: kirro-mock
  template:
    metadata:
      labels:
        app: kirro-mock
    spec:
      # Restricted profile: the image already runs as uid 10001, and fsGroup is what makes the
      # freshly provisioned local-path volume writable by that uid.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: low-priority
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - vps
      containers:
        - name: kirro-mock
          image: ghcr.io/cheetos-gif/kirro:latest
          imagePullPolicy: Always
          command:
            ["uvicorn", "mock_server.app:app", "--host", "0.0.0.0", "--port", "8081", "--proxy-headers",
             "--forwarded-allow-ips", "*"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8081
          env:
            # Both live on the PVC: state and the request log survive a restart (ADR-013).
            - name: MOCK_DB_PATH
              value: /app/data/mock.db
            - name: MOCK_LOG_DIR
              value: /app/data/logs
            # MCP validates the Host header; the ingress passes the public domain, so it must be
            # allowed or every MCP call is a 421 (ADR-012). Update when the host changes.
            - name: MOCK_ALLOWED_HOSTS
              value: api-kirro.upayan.dev,kirro-mock,kirro-mock:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*
            # Optional real Pine Labs Plural UAT call-out (ADR-019, mock_server/pinelabs_plural.py).
            # Absent or blank -> capture/refund stay pure simulation (the default, and every offline
            # test). Set -> a successful capture also places a real UAT sandbox order and a refund a
            # real UAT refund; a sandbox failure is caught and never changes the mock's own response.
            # The values live in the `kirro-pinelabs` Secret (cluster repo, ksops/age) -- UAT sandbox
            # credentials, no real money. `optional: true` so the pod still starts without the Secret.
            - name: PINELABS_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: kirro-pinelabs, key: PINELABS_CLIENT_ID, optional: true }
            - name: PINELABS_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: kirro-pinelabs, key: PINELABS_CLIENT_SECRET, optional: true }
            # The UAT sandbox endpoint; also the client's built-in default (DEFAULT_BASE_URL), set
            # explicitly here so the manifest records which environment this pod talks to.
            - name: PINELABS_BASE_URL
              value: https://pluraluat.v2.pinepg.in
            # Gates /__admin/* behind a matching X-Admin-Key header (#12 item 2: the surface answered
            # unauthenticated on the public mock URL). `optional: true` so this Deployment still comes
            # up before the Secret/key exists; the guard itself (mock_server/app.py) is a no-op until
            # MOCK_ADMIN_KEY is actually set. Provision `kirro-mock-admin/MOCK_ADMIN_KEY` (ksops, same
            # pattern as `kirro-voice` in the cluster repo's `k8s/apps/kirro/secrets/`) to turn it on,
            # then set the same value as X-Admin-Key on every harness /__admin call.
            - name: MOCK_ADMIN_KEY
              valueFrom:
                secretKeyRef: { name: kirro-mock-admin, key: MOCK_ADMIN_KEY, optional: true }
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet: { path: /health, port: 8081 }
            initialDelaySeconds: 3
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 200m, memory: 256Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kirro-mock-data
---
# The WebRTC room server (ADR-017). LiveKit is open source and self-hosted: no per-minute cost and
# no third-party account.
#
# **Not hostNetwork, deliberately.** The obvious way to give a WebRTC server its media ports is
# `hostNetwork: true`, and it does not work here: namespace `kirro` enforces Pod Security
# `baseline`, which forbids host namespaces and hostPorts — and relaxing that to `privileged` to
# suit one pod would hand the permission to every workload in the namespace. Instead the media
# ports are published by a `LoadBalancer` Service (`kirro-livekit-media`), which k3s's ServiceLB
# binds on the node itself; that is the same mechanism Traefik already uses for 80/443 on this
# cluster. The node ends up listening on the same port numbers the server advertises, which is what
# ICE requires.
#
# The media ports must not be reachable through the Ingress — only the signalling WebSocket is, on
# 443 like every other `*.upayan.dev` host. The node's own ports are opened in the cluster repo's
# `terraform/firewall.tf` (7880/tcp is deliberately NOT opened: signalling goes through Traefik).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kirro-livekit
  labels:
    app: kirro-livekit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kirro-livekit
  template:
    metadata:
      labels:
        app: kirro-livekit
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - vps
      containers:
        - name: kirro-livekit
          image: livekit/livekit-server:v1.13.7
          imagePullPolicy: IfNotPresent
          args: ["--config-body", "$(LIVEKIT_CONFIG)"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - { name: signalling, containerPort: 7880, protocol: TCP }
            - { name: rtc-tcp, containerPort: 7881, protocol: TCP }
            - { name: rtc-udp, containerPort: 7882, protocol: UDP }
          env:
            - name: LIVEKIT_CONFIG
              valueFrom:
                configMapKeyRef: { name: kirro-livekit, key: config.yaml }
            # Key pair, shared with the worker. Create the secret before this syncs.
            - name: LIVEKIT_KEYS
              valueFrom:
                secretKeyRef: { name: kirro-voice, key: LIVEKIT_KEYS }
            # The IP the server advertises to clients for media. `status.hostIP` is the node's
            # address whether or not the pod shares its network namespace.
            - name: NODE_IP
              valueFrom:
                fieldRef: { fieldPath: status.hostIP }
          readinessProbe:
            httpGet: { path: /, port: 7880 }
            initialDelaySeconds: 2
          # No `low-priority`: a live call is interactive, and under memory pressure that class is
          # evicted first (`value: -1`), which drops the call. The node has room for this pod's
          # 128Mi.
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 1000m, memory: 512Mi }
---
# The voice bridge (ADR-017): a LiveKit agent worker that joins the room and runs Gnani
# speech-to-text and text-to-speech around the AgenticOrg agent.
#
# replicas: 1 because every call shares one AgenticOrg login, and whether the platform tolerates
# two concurrent `thread_id`s under it is still unverified (ADR-017 §7). The conversation log PVC is
# ReadWriteOnce for the same reason.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kirro-voice
  labels:
    app: kirro-voice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kirro-voice
  template:
    metadata:
      labels:
        app: kirro-voice
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Makes the freshly provisioned local-path volume writable by uid 10001 (same as the mock).
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - vps
      containers:
        - name: kirro-voice
          image: ghcr.io/cheetos-gif/kirro:latest
          imagePullPolicy: Always
          command: ["python", "-m", "voice_bridge.agent", "start"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # In-cluster address: the worker talks to the room server directly, not through the
            # public Ingress.
            - name: LIVEKIT_URL
              value: ws://kirro-livekit:7880
            - name: AGENTICORG_BASE_URL
              value: https://agenticorg.hackathon.pinelabs.com
            - name: VOICE_HEALTH_PORT
              value: "8082"
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef: { name: kirro-voice, key: LIVEKIT_API_KEY }
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef: { name: kirro-voice, key: LIVEKIT_API_SECRET }
            - name: GNANI_API_KEY
              valueFrom:
                secretKeyRef: { name: kirro-voice, key: GNANI_API_KEY }
            - name: AGENTICORG_EMAIL
              valueFrom:
                secretKeyRef: { name: kirro-voice, key: AGENTICORG_EMAIL }
            - name: AGENTICORG_PASSWORD
              valueFrom:
                secretKeyRef: { name: kirro-voice, key: AGENTICORG_PASSWORD }
            # One JSONL file per call, on the PVC: a conversation has to be findable by its id long
            # after the pod that ran it is gone.
            - name: VOICE_LOG_DIR
              value: /app/data/logs
          ports:
            - containerPort: 8082
          volumeMounts:
            - name: logs
              mountPath: /app/data
          readinessProbe:
            httpGet: { path: /, port: 8082 }
            initialDelaySeconds: 5
          resources:
            # Sized from measurement, not taste. At 500m the worker was throttled in ~18% of
            # scheduling periods (`/sys/fs/cgroup/cpu.stat`: nr_periods 5855, nr_throttled 1047)
            # and callers heard the audio break up: a cgroup freeze mid-buffer is audible. The
            # pipeline runs Gnani STT and TTS, the Silero VAD's ONNX model, and HTTP to the agent —
            # 300m/512Mi is roughly what it actually uses, with a 2-core ceiling so nothing waits.
            # No `low-priority` class either: `value: -1` is the first thing evicted under memory
            # pressure, and dropping a live call to reclaim 586Mi is not a trade worth making.
            requests: { cpu: 300m, memory: 512Mi }
            limits: { cpu: 2000m, memory: 1Gi }
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: kirro-voice-logs
