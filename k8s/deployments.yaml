# One image (ghcr.io/cheetos-gif/kirro), one Deployment: kirro-mock is the mock external-services
# backend the AgenticOrg-hosted KIRRO agent calls. KIRRO's decision-making brain lives on the
# AgenticOrg platform (docs/decisions/ADR-011-kirro-brain-moves-to-agenticorg.md), not here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kirro-mock
  labels:
    app: kirro-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kirro-mock
  template:
    metadata:
      labels:
        app: kirro-mock
    spec:
      priorityClassName: low-priority
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - vps
      containers:
        - name: kirro-mock
          image: ghcr.io/cheetos-gif/kirro:latest
          imagePullPolicy: Always
          command: ["uvicorn", "mock_server.app:app", "--host", "0.0.0.0", "--port", "8081"]
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet: { path: /health, port: 8081 }
            initialDelaySeconds: 3
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 200m, memory: 256Mi }
