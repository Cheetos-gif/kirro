# One image (ghcr.io/cheetos-gif/kirro), three Deployments. KIRRO's decision-making brain lives on
# the AgenticOrg platform (docs/decisions/ADR-011-kirro-brain-moves-to-agenticorg.md), not here.
#
# kirro-mock   the mock external services the AgenticOrg-hosted agent calls.
# kirro-livekit  the WebRTC room server the browser publishes its microphone to (ADR-017).
# kirro-voice    the LiveKit agent worker: Gnani speech around the AgenticOrg agent (ADR-017).
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kirro-mock
  labels:
    app: kirro-mock
spec:
  # replicas: 1 is load-bearing — the mock keeps its state in SQLite (ADR-013), which is a
  # single-writer store. Do not scale this horizontally without moving the state first.
  replicas: 1
  selector:
    matchLabels:
      app: kirro-mock
  template:
    metadata:
      labels:
        app: kirro-mock
    spec:
      # Restricted profile: the image already runs as uid 10001, and fsGroup is what makes the
      # freshly provisioned local-path volume writable by that uid.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: low-priority
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - vps
      containers:
        - name: kirro-mock
          image: ghcr.io/cheetos-gif/kirro:latest
          imagePullPolicy: Always
          command:
            ["uvicorn", "mock_server.app:app", "--host", "0.0.0.0", "--port", "8081", "--proxy-headers",
             "--forwarded-allow-ips", "*"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8081
          env:
            # Both live on the PVC: state and the request log survive a restart (ADR-013).
            - name: MOCK_DB_PATH
              value: /app/data/mock.db
            - name: MOCK_LOG_DIR
              value: /app/data/logs
            # MCP validates the Host header; the ingress passes the public domain, so it must be
            # allowed or every MCP call is a 421 (ADR-012). Update when the host changes.
            - name: MOCK_ALLOWED_HOSTS
              value: api-kirro.upayan.dev,kirro-mock,kirro-mock:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet: { path: /health, port: 8081 }
            initialDelaySeconds: 3
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 200m, memory: 256Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kirro-mock-data
---
# The WebRTC room server (ADR-017). LiveKit is open source and self-hosted: no per-minute cost and
# no third-party account.
#
# **Not hostNetwork, deliberately.** The obvious way to give a WebRTC server its media ports is
# `hostNetwork: true`, and it does not work here: namespace `kirro` enforces Pod Security
# `baseline`, which forbids host namespaces and hostPorts — and relaxing that to `privileged` to
# suit one pod would hand the permission to every workload in the namespace. Instead the media
# ports are published by a `LoadBalancer` Service (`kirro-livekit-media`), which k3s's ServiceLB
# binds on the node itself; that is the same mechanism Traefik already uses for 80/443 on this
# cluster. The node ends up listening on the same port numbers the server advertises, which is what
# ICE requires.
#
# The media ports must not be reachable through the Ingress — only the signalling WebSocket is, on
# 443 like every other `*.upayan.dev` host. The node's own ports are opened in the cluster repo's
# `terraform/firewall.tf` (7880/tcp is deliberately NOT opened: signalling goes through Traefik).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kirro-livekit
  labels:
    app: kirro-livekit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kirro-livekit
  template:
    metadata:
      labels:
        app: kirro-livekit
    spec:
      priorityClassName: low-priority
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - vps
      containers:
        - name: kirro-livekit
          image: livekit/livekit-server:v1.13.7
          imagePullPolicy: IfNotPresent
          args: ["--config-body", "$(LIVEKIT_CONFIG)"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - { name: signalling, containerPort: 7880, protocol: TCP }
            - { name: rtc-tcp, containerPort: 7881, protocol: TCP }
            - { name: rtc-udp, containerPort: 7882, protocol: UDP }
          env:
            - name: LIVEKIT_CONFIG
              valueFrom:
                configMapKeyRef: { name: kirro-livekit, key: config.yaml }
            # Key pair, shared with the worker. Create the secret before this syncs.
            - name: LIVEKIT_KEYS
              valueFrom:
                secretKeyRef: { name: kirro-voice, key: LIVEKIT_KEYS }
            # The IP the server advertises to clients for media. `status.hostIP` is the node's
            # address whether or not the pod shares its network namespace.
            - name: NODE_IP
              valueFrom:
                fieldRef: { fieldPath: status.hostIP }
          readinessProbe:
            httpGet: { path: /, port: 7880 }
            initialDelaySeconds: 2
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
# The voice bridge (ADR-017): a LiveKit agent worker that joins the room and runs Gnani
# speech-to-text and text-to-speech around the AgenticOrg agent.
#
# replicas: 1 because the worker drives one shared AgenticOrg login whose chat history is a single
# flat thread (ADR-016), so calls must not be processed concurrently.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kirro-voice
  labels:
    app: kirro-voice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kirro-voice
  template:
    metadata:
      labels:
        app: kirro-voice
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: low-priority
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - vps
      containers:
        - name: kirro-voice
          image: ghcr.io/cheetos-gif/kirro:latest
          imagePullPolicy: Always
          command: ["python", "-m", "voice_bridge.agent", "start"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # In-cluster address: the worker talks to the room server directly, not through the
            # public Ingress.
            - name: LIVEKIT_URL
              value: ws://kirro-livekit:7880
            - name: AGENTICORG_BASE_URL
              value: https://agenticorg.hackathon.pinelabs.com
            - name: VOICE_HEALTH_PORT
              value: "8082"
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef: { name: kirro-voice, key: LIVEKIT_API_KEY }
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef: { name: kirro-voice, key: LIVEKIT_API_SECRET }
            - name: GNANI_API_KEY
              valueFrom:
                secretKeyRef: { name: kirro-voice, key: GNANI_API_KEY }
            - name: AGENTICORG_EMAIL
              valueFrom:
                secretKeyRef: { name: kirro-voice, key: AGENTICORG_EMAIL }
            - name: AGENTICORG_PASSWORD
              valueFrom:
                secretKeyRef: { name: kirro-voice, key: AGENTICORG_PASSWORD }
          ports:
            - containerPort: 8082
          readinessProbe:
            httpGet: { path: /, port: 8082 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 768Mi }
