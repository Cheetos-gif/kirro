# Declarations, the idempotency ledger and the decision log are JSON/JSONL on disk (no database,
# per AGENTS.md) — this PVC is what makes them outlive a pod restart. RWO + replicas: 1: the store
# is per-process state, so this app is deliberately not horizontally scalable.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kirro-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
