# Default-deny ingress for the namespace, then one allow rule:
# - kirro-mock: public (Traefik) + same-namespace. The mock server is now the only service and is
#   reached through the ingress, so it takes the "Direct Traefik" shape the core service used to have.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kirro-default-deny-ingress
  namespace: kirro
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kirro-mock-ingress
  namespace: kirro
spec:
  podSelector:
    matchLabels:
      app: kirro-mock
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8081
---
# The room server (ADR-017).
#
# Two very different traffic paths meet this pod, so the policy has two rules:
#
#   - **Signalling (7880/tcp)** arrives from Traefik, through the Ingress, like any other host here.
#   - **WebRTC media (7881/tcp, 7882/udp)** arrives from the open internet. ServiceLB publishes those
#     ports on the node and DNATs them straight to this pod with the *client's* source address
#     preserved (`externalTrafficPolicy: Local`), which is what ICE needs — so there is no in-cluster
#     source to match and the only honest rule is an `ipBlock`. Restricting it to Cloudflare's ranges
#     would be wrong here for the same reason it is right for 80/443: WebRTC does not come from
#     Cloudflare, it comes from the caller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kirro-livekit-ingress
  namespace: kirro
spec:
  podSelector:
    matchLabels:
      app: kirro-livekit
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 7880
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 7881
        - protocol: UDP
          port: 7882
