# Default-deny ingress for the namespace, then two allow rules:
# - kirro-core: public (Traefik) + same-namespace, same "Direct Traefik" shape as bandit.
# - kirro-mock: same-namespace only — it is the internal fake-vendor backend, never reached from
#   outside the cluster, same shape as the datastore pods (meghmitra postgres etc).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kirro-default-deny-ingress
  namespace: kirro
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kirro-core-ingress
  namespace: kirro
spec:
  podSelector:
    matchLabels:
      app: kirro-core
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kirro-mock-ingress
  namespace: kirro
spec:
  podSelector:
    matchLabels:
      app: kirro-mock
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8081
